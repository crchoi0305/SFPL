  <script>
  (function () {
    var KEY = "sfpl_recruit_popup_dismissed";
    var popup = document.getElementById("recruitPopup");
    if (!popup) return;

    var today = new Date().toDateString();
    var dismissed = "";
    try { dismissed = localStorage.getItem(KEY) || ""; } catch (e) {}
    if (dismissed === today) return; // 오늘은 이미 닫음

    function open() { popup.hidden = false; document.body.style.overflow = "hidden"; }
    function close() { popup.hidden = true; document.body.style.overflow = ""; }
    function hideToday() {
      try { localStorage.setItem(KEY, today); } catch (e) {}
      close();
    }

    document.getElementById("recruitClose").addEventListener("click", close);
    document.getElementById("recruitHideToday").addEventListener("click", hideToday);
    popup.addEventListener("click", function (e) { if (e.target === popup) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !popup.hidden) close(); });

    open();
  })();
  </script>

  function safeDate(d) {
    if (!d) return 0;
    const s = String(d).trim().replaceAll(".", "-").replaceAll("/", "-");
    const t = Date.parse(s);
    return Number.isFinite(t) ? t : 0;
  }

  function formatDate(d) {
    if (!d) return "";
    const m = String(d).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(m)) return m.replaceAll("-", ".");
    return m;
  }

  function isHttpUrl(p){ return /^https?:\/\//i.test(String(p)); }

  // Netlify Image CDN helper (A안): 원본은 유지하고, 전송되는 이미지만 리사이즈/압축/포맷 변환
  // - 내부 경로(/content/...)는 /.netlify/images 로 감싸서 요청
  // - 외부 URL(http/https)은 그대로 사용
  function nlImg(url, w, q = 70, fm = "webp") {
    if (!url) return "";
    const s = String(url).trim();
    if (!s) return "";
    if (isHttpUrl(s)) return s;
    // "/" 유지 (encodeURIComponent 대신 encodeURI)
    const u = encodeURI(s.startsWith("/") ? s : ("/" + s));
    return `/.netlify/images?url=${u}&w=${w}&q=${q}&fm=${fm}`;
  }

  // ✅ 핵심: 이미지는 항상 content/assets/news 기준으로 읽기
  function normalizeImgSrc(v) {
    if (!v) return "";
    const src = (typeof v === "string") ? v : (v && typeof v === "object" ? (v.src || v.image || "") : "");
    const s = String(src || "").trim();
    if (!s) return "";

    // 외부 URL은 그대로
    if (isHttpUrl(s)) return s;

    // 앞의 ./, / 제거
    let clean = s.replace(/^\.?\//, "").replace(/^\/+/, "");

    // 이미 content/assets/news 로 들어오는 경우
    if (clean.startsWith("content/assets/news/")) return "/" + clean;

    // /assets/news/... 또는 assets/news/...
    clean = clean.replace(/^assets\/news\//, "");
    clean = clean.replace(/^content\/assets\/news\//, "");

    // news/... 로 오는 경우도 제거
    clean = clean.replace(/^news\//, "");

    // 파일명만 남았든, 하위폴더가 있든 최종적으로 content/assets/news 아래로
    return "/content/assets/news/" + clean;
  }

  // ===== 아이폰 디코딩 병목 해결: 첫 장만 로드 + 넘길 때 로드 =====
  function hydrateImg(img){
    if (!img || img.dataset.hydrated === "1") return;

    img.loading = "eager";
    const src = img.dataset.src || "";
    if (src) img.src = src;

    const srcset = img.dataset.srcset || "";
    if (srcset) img.srcset = srcset;

    const sizes = img.dataset.sizes || "";
    if (sizes) img.sizes = sizes;

    img.dataset.hydrated = "1";
  }

  function hydrateHomeAround(track, idx, radius = 1){
    const slides = [...track.querySelectorAll(".home-news-slide")];
    for (let k = idx - radius; k <= idx + radius; k++){
      if (k < 0 || k >= slides.length) continue;
      const img = slides[k].querySelector("img");
      hydrateImg(img);
    }
  }

  function homeRealCount(track){
    return parseInt(track.dataset.count || String(track.children.length), 10);
  }

  // 무한 루프: track 끝에 1번 슬라이드 복제본이 있음. pos 는 0..count(복제본).
  function setHomeIndex(track, dots, pos, animate){
    const N = homeRealCount(track);
    if (N <= 1) return;
    if (track._snapT) { clearTimeout(track._snapT); track._snapT = null; }

    track.style.transition = (animate === false) ? "none" : "";
    track.style.transform = `translateX(${-pos * 100}%)`;
    track.dataset.pos = String(pos);

    const real = ((pos % N) + N) % N;
    track.dataset.index = String(real);
    [...dots.children].forEach((d, k) => d.classList.toggle("active", k === real));

    hydrateHomeAround(track, real, 1);
    if (track._clone && (real === 0 || real >= N - 1)) {
      hydrateImg(track._clone.querySelector("img"));
    }
  }

  function stepHome(track, dots, dir){
    const N = homeRealCount(track);
    if (N <= 1) return;

    let pos = parseInt(track.dataset.pos || "0", 10);
    if (pos >= N) { setHomeIndex(track, dots, 0, false); void track.offsetWidth; pos = 0; }
    else if (pos < 0) { setHomeIndex(track, dots, N - 1, false); void track.offsetWidth; pos = N - 1; }

    if (dir > 0) {
      pos += 1;
      setHomeIndex(track, dots, pos, true);
      if (pos >= N) {
        track._snapT = window.setTimeout(function () {
          track._snapT = null;
          setHomeIndex(track, dots, 0, false);
        }, 430);
      }
    } else {
      if (pos <= 0) {
        setHomeIndex(track, dots, N, false);
        void track.offsetWidth;
        setHomeIndex(track, dots, N - 1, true);
      } else {
        setHomeIndex(track, dots, pos - 1, true);
      }
    }
  }

  function renderHomePost(p) {
    const item = document.createElement("article");
    item.className = "home-news-item";

    const top = document.createElement("div");
    top.className = "home-news-top";

    const date = document.createElement("div");
    date.className = "home-news-date";
    date.textContent = formatDate(p.date || "");

    const title = document.createElement("div");
    title.className = "home-news-item-title";
    title.textContent = p.title || "Untitled";

    top.appendChild(date);
    top.appendChild(title);
    item.appendChild(top);

    if (p.desc) {
      const desc = document.createElement("div");
      desc.className = "home-news-desc";
      desc.textContent = p.desc;
      item.appendChild(desc);
    } else {
      const lines = Array.isArray(p.body) ? p.body : (p.body ? [String(p.body)] : []);
      if (lines.length) {
        const desc = document.createElement("div");
        desc.className = "home-news-desc";
        desc.textContent = lines[0];
        item.appendChild(desc);
      }
    }

    const imgsRaw = Array.isArray(p.images) ? p.images : [];
    const imgs = imgsRaw.map(normalizeImgSrc).filter(Boolean);

    if (imgs.length) {
      const carousel = document.createElement("div");
      carousel.className = "home-news-carousel";

      const track = document.createElement("div");
      track.className = "home-news-track";
      track.dataset.index = "0";

      imgs.forEach((src, i) => {
        const slide = document.createElement("div");
        slide.className = "home-news-slide";

        const img = document.createElement("img");

        // ✅ 즉시 src를 넣지 않고 data-*에 저장
        img.dataset.src = nlImg(src, 720);
        img.dataset.srcset = `${nlImg(src, 480)} 480w, ${nlImg(src, 720)} 720w, ${nlImg(src, 960)} 960w`;
        img.dataset.sizes = "(max-width: 640px) 100vw, 720px";

        img.alt = `${p.title || "News"} - ${i + 1}`;
        img.loading = "lazy";
        img.decoding = "async";

        // 로드되면: 세로 이미지면 프레임을 세로로, 여백은 흐림 배경으로 채움
        img.addEventListener("load", () => {
          if (!img.naturalWidth) return;
          const s = img.currentSrc || img.src;
          if (s) slide.style.setProperty("--fill", `url("${s}")`);
          if (img.naturalHeight > img.naturalWidth * 1.05) carousel.classList.add("portrait");
          if (i === 0 && track._clone && s) {
            const cimg = track._clone.querySelector("img");
            if (cimg && !cimg.src) cimg.src = s;
            track._clone.style.setProperty("--fill", `url("${s}")`);
          }
        });

        // ✅ 첫 장만 즉시 로드
        if (i === 0) hydrateImg(img);

        slide.appendChild(img);
        track.appendChild(slide);
      });

      // 무한 루프용: 1번 슬라이드 복제본을 끝에 추가
      if (imgs.length > 1) {
        const clone = track.firstElementChild.cloneNode(true);
        clone.dataset.clone = "1";
        track.appendChild(clone);
        track._clone = clone;
      }
      track.dataset.count = String(imgs.length);
      track.dataset.pos = "0";

      carousel.appendChild(track);

      if (imgs.length > 1) {
        const mkNav = (cls, label, dir) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "home-news-nav " + cls;
          b.textContent = label;
          b.setAttribute("aria-label", dir < 0 ? "이전 이미지" : "다음 이미지");
          b.addEventListener("click", (e) => {
            e.stopPropagation();
            stepHome(track, dots, dir);
            restartAuto();
          });
          return b;
        };
        carousel.appendChild(mkNav("prev", "‹", -1));
        carousel.appendChild(mkNav("next", "›", +1));
      }

      item.appendChild(carousel);

      const dots = document.createElement("div");
      dots.className = "home-news-dots";

      imgs.forEach((_, i) => {
        const d = document.createElement("button");
        d.type = "button";
        d.className = "home-news-dot" + (i === 0 ? " active" : "");
        d.addEventListener("click", (e) => {
          e.stopPropagation();
          setHomeIndex(track, dots, i);
          restartAuto();
        });
        dots.appendChild(d);
      });
      item.appendChild(dots);

      const INTERVAL = 3500;
      let timer = null;

      const startAuto = () => {
        if (imgs.length <= 1) return;
        if (timer) return;
        timer = setInterval(() => stepHome(track, dots, +1), INTERVAL);
      };
      const stopAuto = () => {
        if (!timer) return;
        clearInterval(timer);
        timer = null;
      };
      const restartAuto = () => {
        stopAuto();
        startAuto();
      };

      item.addEventListener("mouseenter", stopAuto);
      item.addEventListener("mouseleave", startAuto);

      let startX = null;
      track.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
        stopAuto();
      }, { passive: true });

      track.addEventListener("touchend", e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(dx) > 40) stepHome(track, dots, dx < 0 ? 1 : -1);
        startAuto();
      }, { passive: true });

      carousel.addEventListener("click", (e) => e.stopPropagation());
      dots.addEventListener("click", (e) => e.stopPropagation());

      // ✅ 초기: 0번 주변만 살짝 프리로드(원치 않으면 radius=0으로)
      hydrateHomeAround(track, 0, 1);

      startAuto();
    }

    item.addEventListener("click", () => {
      window.location.href = "news.html";
    });

    return item;
  }

  async function loadLatestNews() {
    if (!latestWrap) return;

    try {
      const res = await fetch("content/news.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("news.json load failed");
      const data = await res.json();
      const posts = Array.isArray(data.posts) ? data.posts : [];

      posts.sort((a, b) => safeDate(b.date) - safeDate(a.date));
      const top4 = posts.slice(0, 4);

      latestWrap.innerHTML = "";
      if (!top4.length) {
        const empty = document.createElement("div");
        empty.className = "home-news-empty";
        empty.textContent = "등록된 소식이 없습니다.";
        latestWrap.appendChild(empty);
        return;
      }

      top4.forEach(p => latestWrap.appendChild(renderHomePost(p)));
    } catch (e) {
      console.error(e);
      latestWrap.innerHTML = `<div class="home-news-empty">News 데이터를 불러오지 못했습니다. (content/news.json 확인)</div>`;
    }
  }

  loadLatestNews();
</script>
