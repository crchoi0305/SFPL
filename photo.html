<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo | Sustainable Polymer Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-flex">
  <div id="site-header"></div>

  <main class="page-wrap photo-wrap">
    <div class="photo-container">
      <h1 class="page-title">Photos</h1>
      <section id="photoGrid" class="photo-grid"></section>
    </div>
  </main>

  <div id="site-footer"></div>

 <script>
  // ===== GitHub Pages(/<repo>/...) + Custom domain(/) 모두 대응 basePrefix =====
  // - 커스텀 도메인: basePrefix="/"
  // - GitHub Pages(user.github.io/<repo>/...): basePrefix="/<repo>/"
  const basePrefix = (() => {
    const parts = location.pathname.split("/").filter(Boolean);
    if (location.hostname.endsWith("github.io")) {
      const repo = parts[0] || "";
      return "/" + repo + "/";
    }
    return "/";
  })();

  // ===== header load =====
  fetch(basePrefix + "header.html")
    .then(res => { if (!res.ok) throw new Error("header.html load failed"); return res.text(); })
    .then(html => {
      document.getElementById("site-header").innerHTML = html;

      const btn = document.querySelector(".nav-toggle");
      const mobileNav = document.getElementById("mobileNav");
      if (btn && mobileNav) {
        btn.addEventListener("click", () => {
          const open = mobileNav.classList.toggle("open");
          btn.setAttribute("aria-expanded", String(open));
        });
      }

      document
        .querySelectorAll(".dropdown-toggle, .mobile-nav .m-link[href='#']")
        .forEach(el => el.addEventListener("click", e => e.preventDefault()));

      document
        .querySelectorAll("#mobileNav [data-toggle='sub']")
        .forEach(t => {
          t.addEventListener("click", e => {
            e.preventDefault();
            const sub = t.nextElementSibling;
            if (sub && sub.classList.contains("m-sub")) sub.classList.toggle("open");
          });
        });
    })
    .catch(console.error);

  // ===== footer load =====
  fetch(basePrefix + "footer.html")
    .then(res => { if (!res.ok) throw new Error("footer.html load failed"); return res.text(); })
    .then(html => {
      document.getElementById("site-footer").innerHTML = html;
      const y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })
    .catch(console.error);

  // ===== inject CSS for layout + carousel =====
  (function ensurePhotoCSSOnce(){
    if (document.getElementById("photoCarouselCSS")) return;
    const style = document.createElement("style");
    style.id = "photoCarouselCSS";
    style.textContent = `
      main.page-wrap { margin-top: 5px !important; }

      .photo-grid{
        display:grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px;
        align-items: start;
      }
      @media (max-width: 820px){
        .photo-grid{ grid-template-columns: 1fr; gap: 18px; }
      }

      .album-card{
        border: 1px solid rgba(0,0,0,.08);
        border-radius: 16px;
        padding: 16px;
        background: #fff;
      }
      .album-title{
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .album-date{
        font-size: 13px;
        color: rgba(0,0,0,.55);
        margin-bottom: 6px;
      }

      .carousel{ position: relative; width: 100%; overflow: hidden; border-radius: 14px; }
      .carousel-track{
        display:flex;
        transition: transform .38s ease;
        will-change: transform;
        touch-action: pan-y;
      }

      /* 앨범 안에서 모든 사진이 같은 크기가 되도록 프레임을 고정합니다.
         - 기본(가로 사진만 있는 앨범): 3:2 가로 프레임
         - 세로 사진이 하나라도 있는 앨범(.album-portrait): 4:5 세로 프레임
         사진은 잘리지 않고(contain) 프레임 안에 들어가며, 남는 여백은
         같은 사진을 흐리게 깔아 채웁니다. */
      .carousel-slide{
        position: relative;
        flex: 0 0 100%;
        aspect-ratio: 3 / 2;
        border-radius: 14px;
        overflow: hidden;
        background: #eef0f3;
      }
      .album-portrait .carousel-slide{ aspect-ratio: 4 / 5; }

      .carousel-slide::before{
        content: "";
        position: absolute;
        inset: 0;
        background: var(--fill, none) center / cover no-repeat;
        filter: blur(24px) brightness(.82);
        transform: scale(1.18);
        z-index: 0;
      }
      .carousel-img{
        position: relative;
        z-index: 1;
        width:100%;
        height:100%;
        display:block;
        object-fit: contain;
        object-position: center;
      }

      /* 사진 위에 반투명하게 겹쳐지는 좌우 화살표 (Google 사이트 스타일) */
      .carousel-nav{
        position:absolute;
        top:50%;
        transform: translateY(-50%);
        width: 42px; height: 42px;
        display:flex; align-items:center; justify-content:center;
        border:0;
        border-radius:50%;
        background: rgba(0,0,0,.32);
        color:#fff;
        font-size: 24px;
        line-height:1;
        cursor:pointer;
        opacity:.5;
        transition: opacity .18s ease, background .18s ease;
        z-index: 3;
        -webkit-tap-highlight-color: transparent;
      }
      .carousel:hover .carousel-nav{ opacity:.9; }
      .carousel-nav:hover{ opacity:1; background: rgba(0,0,0,.55); }
      .carousel-nav.prev{ left: 10px; }
      .carousel-nav.next{ right: 10px; }
      @media (max-width: 820px){
        .carousel-nav{ opacity:.8; width:38px; height:38px; font-size:21px; }
      }

      .carousel-dots{
        display:flex;
        justify-content:center;
        gap: 8px;
        padding: 10px 0 2px;
      }
      .dot{
        width: 7px; height: 7px;
        border-radius: 999px;
        background: rgba(0,0,0,.25);
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .dot.active{ background: rgba(0,0,0,.75); }

      .album-empty, .album-empty-wide{
        padding: 14px 0;
        color: rgba(0,0,0,.6);
      }
    `;
    document.head.appendChild(style);
  })();

  // ===== helpers =====
  const GH_OWNER  = "crchoi0305";
  const GH_REPO   = "SFPL";
  const GH_BRANCH = "main";
  const GH_RAW_BASE = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}`;

  const grid = document.getElementById("photoGrid");

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function isHttpUrl(p) {
    return /^https?:\/\//i.test(String(p));
  }

  // ===== Netlify Image CDN resize helper =====
  // 원본은 그대로 두고, 출력만 작은 버전으로
  function resizedImg(url, width = 1000, quality = 68) {
    if (!url) return "";
    const s = String(url).trim();
    if (!s) return "";
    if (/^https?:\/\//i.test(s)) return s; // 외부 URL은 그대로

    const path = s.startsWith("/") ? s : "/" + s;
    return `/.netlify/images?url=${encodeURI(path)}&w=${width}&q=${quality}&fm=webp`;
  }

  // ✅ date: "YYYY.MM.DD" 형태에 정확히 맞는 파서
  function parseAlbumDate(d){
    if (!d) return 0;
    const s = String(d).trim().replace(/\./g, "-");
    const t = Date.parse(s);
    return Number.isFinite(t) ? t : 0;
  }

  // ✅ rel 정규화: content/content 제거 + leading slash 처리
  function normalizeRelPath(p){
    let rel = String(p || "").trim();
    rel = rel.replace(/^https?:\/\/[^/]+\/?/, "");
    rel = rel.replace(/^\/+/, "");
    rel = rel.replace(/^content\/content\//, "content/");
    rel = rel.replace(/^\.?\//, "");
    return rel;
  }

  // ===== 이미지: "절대경로(/content/...)" 우선 + 실패 시 raw fallback =====
  function resolveImgSources(v) {
    if (!v) return { primary: "", fallback: "" };

    const src =
      (typeof v === "string") ? v :
      (v && typeof v === "object" ? (v.image || v.src || "") : "");

    const s = String(src || "").trim();
    if (!s) return { primary: "", fallback: "" };

    // 1) 외부 URL이면 그대로
    if (isHttpUrl(s) && !s.startsWith(GH_RAW_BASE + "/")) {
      return { primary: s, fallback: "" };
    }

    // 2) raw URL이면: 로컬 우선 + raw fallback
    if (isHttpUrl(s) && s.startsWith(GH_RAW_BASE + "/")) {
      let rel = s.slice((GH_RAW_BASE + "/").length);
      rel = normalizeRelPath(rel);

      const primary = (basePrefix + rel).replace(/\/\/+/, "/");
      const fallback = s;
      return { primary, fallback };
    }

    // 3) 로컬 경로: primary 로컬 + raw fallback
    const rel = normalizeRelPath(s);
    const primary = s.startsWith("/") ? s : (basePrefix + rel).replace(/\/\/+/, "/");
    const fallback = `${GH_RAW_BASE}/${rel}`;
    return { primary, fallback };
  }

  // ====== 핵심: "초기 2장만" 실제 src를 넣고, 나머지는 data-src로 보관 ======
  function setImgWithDeferredLoad(img, sources, shouldLoadNow) {
    if (!img || !sources) return;

    const primary = sources.primary || "";
    const fallback = sources.fallback || "";

    // 로컬 절대경로면 Netlify CDN으로 경량화
    const finalSrc = (primary && primary.startsWith("/"))
      ? resizedImg(primary, 1000, 68)
      : (primary || fallback || "");

    if (shouldLoadNow) {
      img.src = finalSrc;
    } else {
      img.dataset.src = finalSrc; // 나중에 로드
    }

    img.loading = "lazy";
    img.decoding = "async";

    img.onerror = () => {
      // 실패 시 raw fallback로 1회 전환
      if (fallback && img.src !== fallback) {
        img.src = fallback;
        return;
      }
      img.onerror = null;
    };
  }

  function hydrateImg(img){
    if (!img) return;
    if (img.src) return;                // 이미 로드됨
    const ds = img.dataset.src || "";
    if (!ds) return;
    // 로드 시점은 우리 로직이 이미 결정했으므로 즉시 받아오도록 강제
    img.loading = "eager";
    img.src = ds;
    delete img.dataset.src;
  }

  // 현재 인덱스 기준으로 주변(radius)만 로드
  function hydrateAround(track, idx, radius = 1){
    const slides = [...track.querySelectorAll(".carousel-slide")];
    for (let k = idx - radius; k <= idx + radius; k++){
      if (k < 0 || k >= slides.length) continue;
      const img = slides[k].querySelector("img.carousel-img");
      hydrateImg(img);
    }
  }

  function setActiveDot(dots, idx){
    if (!dots) return;
    [...dots.children].forEach((d, k) => d.classList.toggle("active", k === idx));
  }

  // 무한 루프 캐러셀 (transform 기반). track 끝에 1번 슬라이드 복제본이 있어
  // 마지막 -> 첫 장으로 자연스럽게 이어집니다. pos 는 0..count(복제본).
  function goToIndex(track, dots, pos, animate){
    const count = parseInt(track.dataset.count || "0", 10);
    if (count <= 1) return;
    if (track._snapT) { clearTimeout(track._snapT); track._snapT = null; }

    track.style.transition = (animate === false) ? "none" : "";
    track.style.transform = `translateX(${-pos * 100}%)`;
    track.dataset.pos = String(pos);

    const realIdx = ((pos % count) + count) % count;
    track.dataset.index = String(realIdx);
    setActiveDot(dots, realIdx);
    hydrateAround(track, realIdx, 1);
    if (track._clone && (realIdx === 0 || realIdx >= count - 1)) {
      hydrateImg(track._clone.querySelector("img.carousel-img"));
    }
  }

  function stepCarousel(track, dots, dir){
    const count = parseInt(track.dataset.count || "0", 10);
    if (count <= 1) return;

    let pos = parseInt(track.dataset.pos || "0", 10);
    // 복제본/범위 밖에 걸려 있으면 먼저 실제 위치로 순간 정렬 (빠른 연타 대비)
    if (pos >= count) { goToIndex(track, dots, 0, false); void track.offsetWidth; pos = 0; }
    else if (pos < 0) { goToIndex(track, dots, count - 1, false); void track.offsetWidth; pos = count - 1; }

    if (dir > 0) {
      pos += 1;
      goToIndex(track, dots, pos, true);
      if (pos >= count) {
        track._snapT = window.setTimeout(function () {
          track._snapT = null;
          goToIndex(track, dots, 0, false);
        }, 460);
      }
    } else {
      if (pos <= 0) {
        goToIndex(track, dots, count, false);   // 복제본(=1번과 동일)으로 순간 이동
        void track.offsetWidth;                 // 리플로우
        goToIndex(track, dots, count - 1, true); // 마지막 장으로 슬라이드
      } else {
        goToIndex(track, dots, pos - 1, true);
      }
    }
  }

  // ===== build album carousel =====
  function buildCarousel(album) {
    const card = el("article", "album-card");

    const header = el("div", "album-header");

    if (album.date) {
      const dateText = el("div", "album-date");
      dateText.textContent = String(album.date);
      header.appendChild(dateText);
    }

    const title = el("h2", "album-title");
    title.textContent = album.title || "Untitled";
    header.appendChild(title);

    if (album.desc) {
      const desc = el("p", "album-desc");
      desc.textContent = String(album.desc);
      desc.style.cssText = "margin:6px 0 0;color:rgba(0,0,0,.6);font-size:14px;line-height:1.6;white-space:pre-wrap;";
      header.appendChild(desc);
    }

    card.appendChild(header);

    const wrap = el("div", "carousel");
    const track = el("div", "carousel-track");
    track.dataset.index = "0";
    track.dataset.pos = "0";

    const raw = Array.isArray(album.images) ? album.images : [];
    const imgs = raw.map(resolveImgSources).filter(o => (o && (o.primary || o.fallback)));

    const firstSlideRef = {};
    imgs.forEach((sources, i) => {
      const slide = el("div", "carousel-slide");
      const img = document.createElement("img");
      img.className = "carousel-img";
      img.alt = `${album.title || "Album"} - ${i + 1}`;

      // 로드되면: (1) 세로 사진이면 앨범 프레임을 세로로 전환
      //          (2) 남는 여백용 흐림 배경을 같은 사진으로 채움
      //          (3) 1번 슬라이드면 끝의 복제본도 동일하게 채움
      img.addEventListener("load", () => {
        if (!img.naturalWidth) return;
        const src = img.currentSrc || img.src;
        if (src) slide.style.setProperty("--fill", `url("${src}")`);
        if (img.naturalHeight > img.naturalWidth * 1.05) {
          card.classList.add("album-portrait");
        }
        if (i === 0 && track._clone && src) {
          const cimg = track._clone.querySelector("img.carousel-img");
          if (cimg && !cimg.src) cimg.src = src;
          track._clone.style.setProperty("--fill", `url("${src}")`);
        }
      });

      // ✅ 모든 이미지는 지연 로드 (앨범이 화면에 들어올 때 IntersectionObserver로 로드)
      setImgWithDeferredLoad(img, sources, false);

      slide.appendChild(img);
      track.appendChild(slide);
      if (i === 0) firstSlideRef.el = slide;
    });

    // 무한 루프용: 1번 슬라이드 복제본을 끝에 추가
    if (imgs.length > 1 && firstSlideRef.el) {
      const clone = firstSlideRef.el.cloneNode(true);  // load 리스너는 복제 안 됨(의도적)
      clone.dataset.clone = "1";
      const s0img = firstSlideRef.el.querySelector("img.carousel-img");
      const cimg = clone.querySelector("img.carousel-img");
      if (cimg) {
        if (s0img && s0img.src) { cimg.src = s0img.src; }
        else if (s0img && s0img.dataset.src) { cimg.removeAttribute("src"); cimg.dataset.src = s0img.dataset.src; }
      }
      track.appendChild(clone);
      track._clone = clone;
    }
    track.dataset.count = String(imgs.length);

    wrap.appendChild(track);
    card.appendChild(wrap);

    if (!imgs.length) {
      card.appendChild(el("div", "album-empty", "등록된 사진이 없습니다."));
      return card;
    }

    // 사진이 2장 이상일 때만: 사진 위 좌우 화살표 + 아래 점
    if (imgs.length > 1) {
      const prev = el("button", "carousel-nav prev", "‹");
      const next = el("button", "carousel-nav next", "›");
      prev.type = next.type = "button";
      prev.setAttribute("aria-label", "이전 사진");
      next.setAttribute("aria-label", "다음 사진");

      const dots = el("div", "carousel-dots");
      imgs.forEach((_, i) => {
        const d = el("button", "dot" + (i === 0 ? " active" : ""), "");
        d.type = "button";
        d.addEventListener("click", () => goToIndex(track, dots, i, true));
        dots.appendChild(d);
      });

      prev.addEventListener("click", () => stepCarousel(track, dots, -1));
      next.addEventListener("click", () => stepCarousel(track, dots, +1));

      // 모바일 스와이프
      let sx = null;
      wrap.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
      wrap.addEventListener("touchend", (e) => {
        if (sx === null) return;
        const dx = e.changedTouches[0].clientX - sx;
        sx = null;
        if (Math.abs(dx) > 40) stepCarousel(track, dots, dx < 0 ? 1 : -1);
      }, { passive: true });

      wrap.appendChild(prev);
      wrap.appendChild(next);
      card.appendChild(dots);
    }

    // ✅ 앨범이 뷰포트에 접근할 때만 첫 장(+좌우 1장)을 로드하도록 훅 저장
    card._hydrateFirst = () => hydrateAround(track, 0, 1);

    return card;
  }

  // ===== init =====
  async function init() {
    try {
      const res = await fetch(basePrefix + "content/photos.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("photos.json load failed");

      const data = await res.json();
      const albums = Array.isArray(data.albums) ? data.albums.slice() : [];

      if (!albums.length) {
        grid.appendChild(el("div", "album-empty-wide", "등록된 앨범이 없습니다."));
        return;
      }

      albums.sort((a, b) => parseAlbumDate(b.date) - parseAlbumDate(a.date));

      const cards = albums.map(a => {
        const c = buildCarousel(a);
        grid.appendChild(c);
        return c;
      });

      const hydrateCard = (c) => {
        if (!c || c._hydrated) return;
        c._hydrated = true;
        if (typeof c._hydrateFirst === "function") c._hydrateFirst();
      };

      // 1) 첫 화면 앨범들은 즉시 로드 (원본이 이미 가벼워 부담 적음)
      const EAGER = 6;
      cards.slice(0, EAGER).forEach(hydrateCard);

      // 2) 나머지는 스크롤로 뷰포트에 근접하면 로드 (IntersectionObserver + scroll 폴백)
      const rest = cards.slice(EAGER);
      const checkRest = () => {
        const limit = window.innerHeight + 800;
        rest.forEach(c => {
          if (c._hydrated) return;
          const top = c.getBoundingClientRect().top;
          if (top < limit) hydrateCard(c);
        });
      };

      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            io.unobserve(entry.target);
            hydrateCard(entry.target);
          });
        }, { rootMargin: "800px 0px" });
        rest.forEach(c => io.observe(c));
      }

      window.addEventListener("scroll", checkRest, { passive: true });
      window.addEventListener("resize", checkRest, { passive: true });
      checkRest();
      setTimeout(checkRest, 1200);
    } catch (e) {
      console.error(e);
      grid.appendChild(el("div", "album-empty-wide", "Photo 데이터를 불러오지 못했습니다. (content/photos.json 확인)"));
    }
  }

  init();
</script>
</body>
</html>
