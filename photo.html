<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo | SFPL</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-flex">
  <div id="site-header"></div>

  <main class="page-wrap photo-wrap">
    <div class="photo-container">
      <h1 class="page-title">Photos</h1>
      <section id="photoGrid" class="photo-grid"></section>
    </div>
  </main>

  <div id="site-footer"></div>

 <script>
  // ===== GitHub Pages(/<repo>/...) + Custom domain(/) 모두 대응 basePrefix =====
  // - 커스텀 도메인: basePrefix="/"
  // - GitHub Pages(user.github.io/<repo>/...): basePrefix="/<repo>/"
  const basePrefix = (() => {
    const parts = location.pathname.split("/").filter(Boolean);
    if (location.hostname.endsWith("github.io")) {
      const repo = parts[0] || "";
      return "/" + repo + "/";
    }
    return "/";
  })();

  // ===== header load =====
  fetch(basePrefix + "header.html")
    .then(res => { if (!res.ok) throw new Error("header.html load failed"); return res.text(); })
    .then(html => {
      document.getElementById("site-header").innerHTML = html;

      const btn = document.querySelector(".nav-toggle");
      const mobileNav = document.getElementById("mobileNav");
      if (btn && mobileNav) {
        btn.addEventListener("click", () => {
          const open = mobileNav.classList.toggle("open");
          btn.setAttribute("aria-expanded", String(open));
        });
      }

      document
        .querySelectorAll(".dropdown-toggle, .mobile-nav .m-link[href='#']")
        .forEach(el => el.addEventListener("click", e => e.preventDefault()));

      document
        .querySelectorAll("#mobileNav [data-toggle='sub']")
        .forEach(t => {
          t.addEventListener("click", e => {
            e.preventDefault();
            const sub = t.nextElementSibling;
            if (sub && sub.classList.contains("m-sub")) sub.classList.toggle("open");
          });
        });
    })
    .catch(console.error);

  // ===== footer load =====
  fetch(basePrefix + "footer.html")
    .then(res => { if (!res.ok) throw new Error("footer.html load failed"); return res.text(); })
    .then(html => {
      document.getElementById("site-footer").innerHTML = html;
      const y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })
    .catch(console.error);

  // ===== inject CSS for layout + carousel =====
  (function ensurePhotoCSSOnce(){
    if (document.getElementById("photoCarouselCSS")) return;
    const style = document.createElement("style");
    style.id = "photoCarouselCSS";
    style.textContent = `
      main.page-wrap { margin-top: 5px !important; }

      .photo-grid{
        display:grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px;
        align-items: start;
      }
      @media (max-width: 820px){
        .photo-grid{ grid-template-columns: 1fr; gap: 18px; }
      }

      .album-card{
        border: 1px solid rgba(0,0,0,.08);
        border-radius: 16px;
        padding: 16px;
        background: #fff;
      }
      .album-title{
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .album-date{
        font-size: 13px;
        color: rgba(0,0,0,.55);
        margin-bottom: 6px;
      }

      .carousel{ position: relative; width: 100%; }
      .carousel-track{
        display:flex;
        overflow-x:auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 0;
        scrollbar-width: none;
      }
      .carousel-track::-webkit-scrollbar{ display:none; }

      /* 모든 사진을 동일한 3:2 프레임에 채웁니다(가운데 기준, 일부 잘릴 수 있음)
         -> 사진 원본 비율이 달라도 앨범 안에서 크기가 통일됩니다. */
      .carousel-slide{
        flex: 0 0 100%;
        scroll-snap-align: center;
        aspect-ratio: 3 / 2;
        border-radius: 14px;
        overflow: hidden;
        background: rgba(0,0,0,.06);
      }
      .carousel-img{
        width:100%;
        height:100%;
        display:block;
        object-fit: cover;
        object-position: center;
        background: rgba(0,0,0,.06);
      }

      /* 사진 위에 반투명하게 겹쳐지는 좌우 화살표 (Google 사이트 스타일) */
      .carousel-nav{
        position:absolute;
        top:50%;
        transform: translateY(-50%);
        width: 42px; height: 42px;
        display:flex; align-items:center; justify-content:center;
        border:0;
        border-radius:50%;
        background: rgba(0,0,0,.32);
        color:#fff;
        font-size: 24px;
        line-height:1;
        cursor:pointer;
        opacity:.5;
        transition: opacity .18s ease, background .18s ease;
        z-index: 3;
        -webkit-tap-highlight-color: transparent;
      }
      .carousel:hover .carousel-nav{ opacity:.9; }
      .carousel-nav:hover{ opacity:1; background: rgba(0,0,0,.55); }
      .carousel-nav.prev{ left: 10px; }
      .carousel-nav.next{ right: 10px; }
      @media (max-width: 820px){
        .carousel-nav{ opacity:.8; width:38px; height:38px; font-size:21px; }
      }

      .carousel-dots{
        display:flex;
        justify-content:center;
        gap: 8px;
        padding: 10px 0 2px;
      }
      .dot{
        width: 7px; height: 7px;
        border-radius: 999px;
        background: rgba(0,0,0,.25);
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .dot.active{ background: rgba(0,0,0,.75); }

      .album-empty, .album-empty-wide{
        padding: 14px 0;
        color: rgba(0,0,0,.6);
      }
    `;
    document.head.appendChild(style);
  })();

  // ===== helpers =====
  const GH_OWNER  = "crchoi0305";
  const GH_REPO   = "SFPL";
  const GH_BRANCH = "main";
  const GH_RAW_BASE = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}`;

  const grid = document.getElementById("photoGrid");

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function isHttpUrl(p) {
    return /^https?:\/\//i.test(String(p));
  }

  // ===== Netlify Image CDN resize helper =====
  // 원본은 그대로 두고, 출력만 작은 버전으로
  function resizedImg(url, width = 1000, quality = 68) {
    if (!url) return "";
    const s = String(url).trim();
    if (!s) return "";
    if (/^https?:\/\//i.test(s)) return s; // 외부 URL은 그대로

    const path = s.startsWith("/") ? s : "/" + s;
    return `/.netlify/images?url=${encodeURI(path)}&w=${width}&q=${quality}&fm=webp`;
  }

  // ✅ date: "YYYY.MM.DD" 형태에 정확히 맞는 파서
  function parseAlbumDate(d){
    if (!d) return 0;
    const s = String(d).trim().replace(/\./g, "-");
    const t = Date.parse(s);
    return Number.isFinite(t) ? t : 0;
  }

  // ✅ rel 정규화: content/content 제거 + leading slash 처리
  function normalizeRelPath(p){
    let rel = String(p || "").trim();
    rel = rel.replace(/^https?:\/\/[^/]+\/?/, "");
    rel = rel.replace(/^\/+/, "");
    rel = rel.replace(/^content\/content\//, "content/");
    rel = rel.replace(/^\.?\//, "");
    return rel;
  }

  // ===== 이미지: "절대경로(/content/...)" 우선 + 실패 시 raw fallback =====
  function resolveImgSources(v) {
    if (!v) return { primary: "", fallback: "" };

    const src =
      (typeof v === "string") ? v :
      (v && typeof v === "object" ? (v.image || v.src || "") : "");

    const s = String(src || "").trim();
    if (!s) return { primary: "", fallback: "" };

    // 1) 외부 URL이면 그대로
    if (isHttpUrl(s) && !s.startsWith(GH_RAW_BASE + "/")) {
      return { primary: s, fallback: "" };
    }

    // 2) raw URL이면: 로컬 우선 + raw fallback
    if (isHttpUrl(s) && s.startsWith(GH_RAW_BASE + "/")) {
      let rel = s.slice((GH_RAW_BASE + "/").length);
      rel = normalizeRelPath(rel);

      const primary = (basePrefix + rel).replace(/\/\/+/, "/");
      const fallback = s;
      return { primary, fallback };
    }

    // 3) 로컬 경로: primary 로컬 + raw fallback
    const rel = normalizeRelPath(s);
    const primary = s.startsWith("/") ? s : (basePrefix + rel).replace(/\/\/+/, "/");
    const fallback = `${GH_RAW_BASE}/${rel}`;
    return { primary, fallback };
  }

  // ====== 핵심: "초기 2장만" 실제 src를 넣고, 나머지는 data-src로 보관 ======
  function setImgWithDeferredLoad(img, sources, shouldLoadNow) {
    if (!img || !sources) return;

    const primary = sources.primary || "";
    const fallback = sources.fallback || "";

    // 로컬 절대경로면 Netlify CDN으로 경량화
    const finalSrc = (primary && primary.startsWith("/"))
      ? resizedImg(primary, 1000, 68)
      : (primary || fallback || "");

    if (shouldLoadNow) {
      img.src = finalSrc;
    } else {
      img.dataset.src = finalSrc; // 나중에 로드
    }

    img.loading = "lazy";
    img.decoding = "async";

    img.onerror = () => {
      // 실패 시 raw fallback로 1회 전환
      if (fallback && img.src !== fallback) {
        img.src = fallback;
        return;
      }
      img.onerror = null;
    };
  }

  function hydrateImg(img){
    if (!img) return;
    if (img.src) return;                // 이미 로드됨
    const ds = img.dataset.src || "";
    if (!ds) return;
    // 로드 시점은 우리 로직이 이미 결정했으므로 즉시 받아오도록 강제
    img.loading = "eager";
    img.src = ds;
    delete img.dataset.src;
  }

  // 현재 인덱스 기준으로 주변(radius)만 로드
  function hydrateAround(track, idx, radius = 1){
    const slides = [...track.querySelectorAll(".carousel-slide")];
    for (let k = idx - radius; k <= idx + radius; k++){
      if (k < 0 || k >= slides.length) continue;
      const img = slides[k].querySelector("img.carousel-img");
      hydrateImg(img);
    }
  }

  function scrollToIndex(track, i){
    const slides = track.querySelectorAll(".carousel-slide");
    const idx = Math.max(0, Math.min(slides.length - 1, i));
    const target = slides[idx];
    const left = target.offsetLeft - track.offsetLeft;
    track.scrollTo({ left, behavior: "smooth" });
    track.dataset.index = String(idx);

    // ✅ 넘길 때 해당 장 + 좌우 1장만 로드
    hydrateAround(track, idx, 1);
  }

  function setActiveDot(dots, idx){
    [...dots.children].forEach((d, k) => d.classList.toggle("active", k === idx));
  }

  function bindScrollSync(track, dots){
    let raf = null;
    const slides = () => [...track.querySelectorAll(".carousel-slide")];

    track.addEventListener("scroll", () => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const ss = slides();
        if (!ss.length) return;

        const center = track.scrollLeft + track.clientWidth / 2;
        let bestIdx = 0;
        let bestDist = Infinity;

        ss.forEach((s, i) => {
          const sCenter = (s.offsetLeft - track.offsetLeft) + s.clientWidth / 2;
          const dist = Math.abs(center - sCenter);
          if (dist < bestDist) { bestDist = dist; bestIdx = i; }
        });

        track.dataset.index = String(bestIdx);
        setActiveDot(dots, bestIdx);

        // ✅ 스크롤로 인덱스가 바뀌면 주변만 로드
        hydrateAround(track, bestIdx, 1);
      });
    }, { passive: true });
  }

  // ===== build album carousel =====
  function buildCarousel(album) {
    const card = el("article", "album-card");

    const header = el("div", "album-header");

    if (album.date) {
      const dateText = el("div", "album-date");
      dateText.textContent = String(album.date);
      header.appendChild(dateText);
    }

    const title = el("h2", "album-title");
    title.textContent = album.title || "Untitled";
    header.appendChild(title);

    if (album.desc) {
      const desc = el("p", "album-desc");
      desc.textContent = String(album.desc);
      desc.style.cssText = "margin:6px 0 0;color:rgba(0,0,0,.6);font-size:14px;line-height:1.6;white-space:pre-wrap;";
      header.appendChild(desc);
    }

    card.appendChild(header);

    const wrap = el("div", "carousel");
    const track = el("div", "carousel-track");
    track.dataset.index = "0";

    const raw = Array.isArray(album.images) ? album.images : [];
    const imgs = raw.map(resolveImgSources).filter(o => (o && (o.primary || o.fallback)));

    imgs.forEach((sources, i) => {
      const slide = el("div", "carousel-slide");
      const img = document.createElement("img");
      img.className = "carousel-img";
      img.alt = `${album.title || "Album"} - ${i + 1}`;

      // ✅ 모든 이미지는 지연 로드 (앨범이 화면에 들어올 때 IntersectionObserver로 로드)
      setImgWithDeferredLoad(img, sources, false);

      slide.appendChild(img);
      track.appendChild(slide);
    });

    wrap.appendChild(track);
    card.appendChild(wrap);

    if (!imgs.length) {
      card.appendChild(el("div", "album-empty", "등록된 사진이 없습니다."));
      return card;
    }

    // 사진이 2장 이상일 때만: 사진 위 좌우 화살표 + 아래 점
    if (imgs.length > 1) {
      const prev = el("button", "carousel-nav prev", "‹");
      const next = el("button", "carousel-nav next", "›");
      prev.type = next.type = "button";
      prev.setAttribute("aria-label", "이전 사진");
      next.setAttribute("aria-label", "다음 사진");

      prev.addEventListener("click", () => {
        const cur = parseInt(track.dataset.index || "0", 10);
        scrollToIndex(track, cur - 1);
      });
      next.addEventListener("click", () => {
        const cur = parseInt(track.dataset.index || "0", 10);
        scrollToIndex(track, cur + 1);
      });

      wrap.appendChild(prev);
      wrap.appendChild(next);

      const dots = el("div", "carousel-dots");
      imgs.forEach((_, i) => {
        const d = el("button", "dot" + (i === 0 ? " active" : ""), "");
        d.type = "button";
        d.addEventListener("click", () => scrollToIndex(track, i));
        dots.appendChild(d);
      });
      card.appendChild(dots);

      bindScrollSync(track, dots);
    }

    // ✅ 앨범이 뷰포트에 접근할 때만 첫 장(+좌우 1장)을 로드하도록 훅 저장
    card._hydrateFirst = () => hydrateAround(track, 0, 1);

    return card;
  }

  // ===== init =====
  async function init() {
    try {
      const res = await fetch(basePrefix + "content/photos.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("photos.json load failed");

      const data = await res.json();
      const albums = Array.isArray(data.albums) ? data.albums.slice() : [];

      if (!albums.length) {
        grid.appendChild(el("div", "album-empty-wide", "등록된 앨범이 없습니다."));
        return;
      }

      albums.sort((a, b) => parseAlbumDate(b.date) - parseAlbumDate(a.date));

      const cards = albums.map(a => {
        const c = buildCarousel(a);
        grid.appendChild(c);
        return c;
      });

      const hydrateCard = (c) => {
        if (!c || c._hydrated) return;
        c._hydrated = true;
        if (typeof c._hydrateFirst === "function") c._hydrateFirst();
      };

      // 1) 첫 화면 앨범들은 즉시 로드 (원본이 이미 가벼워 부담 적음)
      const EAGER = 6;
      cards.slice(0, EAGER).forEach(hydrateCard);

      // 2) 나머지는 스크롤로 뷰포트에 근접하면 로드 (IntersectionObserver + scroll 폴백)
      const rest = cards.slice(EAGER);
      const checkRest = () => {
        const limit = window.innerHeight + 800;
        rest.forEach(c => {
          if (c._hydrated) return;
          const top = c.getBoundingClientRect().top;
          if (top < limit) hydrateCard(c);
        });
      };

      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            io.unobserve(entry.target);
            hydrateCard(entry.target);
          });
        }, { rootMargin: "800px 0px" });
        rest.forEach(c => io.observe(c));
      }

      window.addEventListener("scroll", checkRest, { passive: true });
      window.addEventListener("resize", checkRest, { passive: true });
      checkRest();
      setTimeout(checkRest, 1200);
    } catch (e) {
      console.error(e);
      grid.appendChild(el("div", "album-empty-wide", "Photo 데이터를 불러오지 못했습니다. (content/photos.json 확인)"));
    }
  }

  init();
</script>
</body>
</html>
